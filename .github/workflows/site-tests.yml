name: Site testleri

# Zamanlama GitHub'ın kendi zamanlayıcısıyla değil, dışarıdan (workflow_dispatch) yapılır:
# GitHub zamanlayıcısı saatleri güvenilir tutmadı. Test saatleri README'de.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test türü'
        type: choice
        options: [hourly, full]
        default: hourly
      sites:
        description: 'Sadece bu siteler (virgülle; boş = hepsi). Doluysa mail gönderilmez (deneme)'
        required: false
        default: ''
      only:
        description: 'Sadece bu akışlar (virgülle; ör. core,genel,tarayici). Boş = hepsi'
        required: false
        default: ''

# Aynı anda iki tur çalışmasın (uyarı durumu karışmasın)
concurrency:
  group: site-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Saatlik tur bir sonraki saat başlamadan bitmeli (kod 45 dk'da kalan siteleri atlar)
    timeout-minutes: ${{ inputs.mode == 'full' && 355 || 55 }}
    steps:
      # Test dosyası kütüphanesi (fixtures/kutuphane, ~100 MB) her saat indirilmesin
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            sites
            fixtures/genel
            fixtures/builder
            fixtures/gangsheet
            fixtures/formatlar

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Saatlik testte sadece Chrome; Firefox/Safari sadece genel testte
      - name: Tarayıcıyı kur
        run: npx playwright install --with-deps ${{ inputs.mode == 'full' && 'chromium firefox webkit' || 'chromium' }}

      # Uyarı durumu (hangi kontrol şu an sorunlu) saatlik turlar arasında saklanır (uyari.js):
      # yeni sorun → ACİL / Uyarı maili, düzelince → "Düzeldi" maili. Genel test bu durumu değiştirmez.
      - name: Önceki uyarı durumunu yükle
        uses: actions/cache/restore@v4
        with:
          path: results/state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Test türünü belirle
        id: mode
        run: |
          echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"

      - name: Testleri çalıştır
        run: node run.js --mode ${{ steps.mode.outputs.mode }} ${{ inputs.sites && format('--sites {0}', inputs.sites) || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
        env:
          WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          NO_MAIL: ${{ inputs.sites }}

      - name: Uyarı durumunu kaydet
        if: always() && hashFiles('results/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: results/state.json
          key: alert-state-${{ github.run_id }}

      - name: Sonuçları ve ekran görüntülerini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonuclar-${{ steps.mode.outputs.mode }}-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: ignore
